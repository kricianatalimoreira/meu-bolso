<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6f9"><title>Meu Bolso • Finanças leves</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><span class="eyebrow">UM PASSO DE CADA VEZ</span><h1>Meu bolso<span>✿</span></h1></div><button class="icon" id="backup" aria-label="Exportar backup">↗</button></header><div class="month"><button id="prev" aria-label="Mês anterior">‹</button><strong id="month"></strong><button id="next" aria-label="Próximo mês">›</button></div><div id="content"></div><p class="privacy">♡ Seus registros ficam salvos neste navegador.<br>Exporte um backup para guardar uma cópia.</p></main><nav><button data-tab="home" class="active">⌂<span>Início</span></button><button data-tab="records">☷<span>Registros</span></button><button data-tab="bills">▤<span>Contas</span></button><button data-tab="plan">◎<span>Meu plano</span></button></nav><dialog id="modal"><form id="form"><div class="dialog-head"><h2 id="form-title">Novo gasto</h2><button type="button" id="close" class="icon" aria-label="Fechar">×</button></div><input name="type" type="hidden"><label>Descrição<input name="name" maxlength="80" placeholder="Ex.: compras do mercado" required></label><label>Valor (R$)<input name="amount" type="number" step="0.01" min="0.01" max="999999999" inputmode="decimal" placeholder="0,00" required></label><label>Data<input name="date" type="date" required></label><label>Categoria<select name="category"><option>Mercado</option><option>Moradia</option><option>Transporte</option><option>Comida</option><option>Saúde</option><option>Lazer</option><option>Assinaturas</option><option>Outros</option></select></label><label>Para quem?<select name="person"><option>Todos</option><option>Kricia</option><option>Marcelo</option><option>Conrado</option><option>Helena</option><option>Mateus</option></select></label><button class="primary" type="submit">Salvar registro</button></form></dialog><div id="toast" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script><script src="cloud.js"></script></body></html>
